<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG 시스템 — 걷기×전술</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">⚔️</span>
                <span class="logo-text">걷기×전술 RPG</span>
            </div>
            <nav class="nav">
                <a href="#hero">소개</a>
                <a href="#core">핵심</a>
                <a href="#combat">전투</a>
                <a href="#modules">모듈</a>
            </nav>
        </div>
    </header>

    <!-- 히어로 섹션 -->
    <section id="hero" class="hero">
        <div class="container">
            {{ sections.hero | safe }}
        </div>
    </section>

    <!-- 핵심 원칙 섹션 -->
    <section id="core" class="section section-light">
        <div class="container">
            <h2 class="section-title">핵심 원칙</h2>
            <div class="content-box">
                {{ sections.core | safe }}
            </div>
        </div>
    </section>

    <!-- 전투 시스템 섹션 -->
    <section id="combat" class="section section-dark">
        <div class="container">
            <h2 class="section-title">전투 시스템</h2>
            <div class="combat-triangle">
                {{ sections.combat | safe }}
            </div>
        </div>
    </section>

    <!-- 모듈 개발 섹션 -->
    <section id="modules" class="section section-light">
        <div class="container">
            <h2 class="section-title">모듈식 개발</h2>
            <div class="content-box">
                {{ sections.modules | safe }}
            </div>
        </div>
    </section>

    <!-- 푸터 -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 걷기×전술 RPG — 모바일 전술 RPG의 새로운 패러다임</p>
            <p class="footer-note">엔진: Godot 4.7 · 타겟: 모바일 (Android 우선)</p>
        </div>
    </footer>

    <!-- 스크롤 애니메이션 -->
    <script>
        // 부드러운 스크롤
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });

        // 스크롤 시 페이드인 애니메이션
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.section').forEach(section => {
            section.style.opacity = '0';
            section.style.transform = 'translateY(30px)';
            section.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            observer.observe(section);
        });
    </script>
</body>
</html>
