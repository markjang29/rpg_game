<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG 자산 워크벤치 — RELAY-36 프로토타입</title>
<style>
:root{--bg:#101418;--card:#1a2129;--line:#2a3542;--tx:#e8eef4;--dim:#8fa3b5;--ac:#4da3ff;--ok:#3ecf8e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:14px;max-width:1080px;margin:0 auto}
h1{font-size:18px;margin-bottom:2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.lbl{font-size:12px;color:var(--dim);margin:10px 0 5px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tbtn{background:#0d1218;border:1px solid var(--line);border-radius:10px;padding:10px 4px;color:var(--tx);font-size:13px;cursor:pointer;text-align:center}
.tbtn.on{border-color:var(--ac);color:var(--ac);background:#12202e}
.styles{display:flex;gap:8px;flex-wrap:wrap}
textarea{width:100%;background:#0d1218;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:10px;font-size:14px;min-height:56px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input.seed{background:#0d1218;border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px;width:160px;font-size:13px}
button.go{background:var(--ac);color:#04121f;border:none;border-radius:8px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.5;cursor:wait}
button.sm{background:#12202e;color:var(--ac);border:1px solid var(--ac);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:#0d1218;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item img{width:100%;display:block;aspect-ratio:auto;max-height:280px;object-fit:cover;cursor:pointer}
.meta{padding:8px;font-size:11px;color:var(--dim);display:flex;justify-content:space-between;align-items:center;gap:4px}
.aid{color:var(--tx);font-weight:600}
.dlg{position:fixed;inset:0;background:rgba(4,8,12,.92);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg.on{display:flex}
.dbox{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:860px;width:100%;max-height:92vh;overflow:auto;padding:16px}
.dbox img{max-width:100%;border-radius:8px;margin:10px 0}
.kv{font-size:12px;color:var(--dim);line-height:1.7;word-break:break-all}
.kv b{color:var(--tx)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#233042;border:1px solid var(--ac);border-radius:10px;padding:10px 18px;font-size:13px;display:none}
.empty{color:var(--dim);text-align:center;padding:30px;font-size:13px}
</style>
</head>
<body>
<h1>RPG 자산 워크벤치</h1>
<div class="sub">RELAY-36 프로토타입 스파이크 · NAI Opus 무료 사이즈 · 생성물은 WB- 임시번호</div>

<div class="panel">
  <div class="lbl">① 자산 유형</div>
  <div class="types" id="types"></div>
  <div class="lbl">② 렌더 스타일 (도트 여부 미결정 — 언제든 전환)</div>
  <div class="styles" id="styles"></div>
  <div class="lbl">③ 추가 지시 (분위기·팔레트·디테일 — 영어 키워드 권장)</div>
  <textarea id="extra" placeholder="예: frost sorceress, ice crystals, pale blue palette, flowing robe"></textarea>
  <div class="row" style="margin-top:10px">
    <input class="seed" id="seed" type="number" placeholder="시드(비우면 랜덤)">
    <button class="go" id="go">생성</button>
    <span id="stat" style="font-size:12px;color:var(--dim)"></span>
  </div>
</div>

<div class="panel">
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
    <b style="font-size:14px">갤러리</b>
    <button class="sm" onclick="loadGallery()">새로고침</button>
  </div>
  <div class="grid" id="grid"><div class="empty">아직 자산이 없습니다 — 위에서 생성해보세요</div></div>
</div>

<div class="dlg" id="dlg" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="dbox" id="dbox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = new URLSearchParams(location.search).get('k') || '';
const H = {'X-Key': KEY, 'Content-Type': 'application/json'};
let TYPE = localStorage.getItem('wb_type') || 'CHR';
let STYLE = localStorage.getItem('wb_style') || 'illust';
let TYPES = {}, STYLES = {};

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}

async function initTypes(){
  const r = await fetch('/api/types', {headers: H});
  const d = await r.json();
  TYPES = d.types; STYLES = d.styles;
  if(!TYPES[TYPE]) TYPE = Object.keys(TYPES)[0];
  if(!STYLES[STYLE]) STYLE = Object.keys(STYLES)[0];
  renderPicks();
}
function renderPicks(){
  document.getElementById('types').innerHTML = Object.entries(TYPES).map(([k,v]) =>
    `<div class="tbtn ${k===TYPE?'on':''}" onclick="setT('${k}')">${k}<br><span style="font-size:11px">${v.label}</span></div>`).join('');
  document.getElementById('styles').innerHTML = Object.entries(STYLES).map(([k,v]) =>
    `<div class="tbtn ${k===STYLE?'on':''}" onclick="setS('${k}')">${v.label}</div>`).join('');
}
function setT(k){TYPE=k;localStorage.setItem('wb_type',k);renderPicks()}
function setS(k){STYLE=k;localStorage.setItem('wb_style',k);renderPicks()}

async function generate(){
  const go=document.getElementById('go');
  go.disabled=true;document.getElementById('stat').textContent='생성 중… (수십 초)';
  try{
    const body={type:TYPE, style:STYLE, extra:document.getElementById('extra').value};
    const s=document.getElementById('seed').value;
    if(s) body.seed=parseInt(s);
    const r=await fetch('/api/generate',{method:'POST',headers:H,body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||r.status);
    toast(d.id+' 생성 완료 (seed '+d.seed+')');
    loadGallery();
  }catch(e){toast('실패: '+e.message)}
  go.disabled=false;document.getElementById('stat').textContent='';
}

async function reroll(id){
  toast('리롤 중…');
  const r=await fetch('/api/reroll',{method:'POST',headers:H,body:JSON.stringify({id})});
  const d=await r.json();
  if(!r.ok){toast('리롤 실패: '+(d.error||r.status));return}
  toast(d.id+' 리롤 완료 ← '+id);
  loadGallery();
}

async function loadGallery(){
  const r=await fetch('/api/gallery',{headers:H});
  const d=await r.json();
  const g=document.getElementById('grid');
  if(!d.items.length){g.innerHTML='<div class="empty">아직 자산이 없습니다</div>';return}
  g.innerHTML=d.items.map(m=>`<div class="item">
    <img src="/img/${m.id}.png?k=${KEY}" loading="lazy" onclick="detail('${m.id}')">
    <div class="meta"><span class="aid">${m.id}</span><span>${m.type_label}·${m.seed}</span><button class="sm" onclick="reroll('${m.id}')">리롤</button></div>
  </div>`).join('');
}

async function detail(id){
  const r=await fetch('/api/gallery',{headers:H});
  const m=(await r.json()).items.find(x=>x.id===id)||{};
  document.getElementById('dbox').innerHTML=`
    <div class="row" style="justify-content:space-between">
      <b style="font-size:16px">${m.id} <span style="color:var(--dim);font-weight:400">(${m.type_label}·${m.style})</span></b>
      <button class="sm" onclick="document.getElementById('dlg').classList.remove('on')">닫기</button>
    </div>
    <img src="/img/${m.id}.png?k=${KEY}">
    <div class="kv">
      <b>seed</b> ${m.seed} · <b>모델</b> ${m.model} · <b>크기</b> ${m.size} · <b>생성</b> ${m.ts}<br>
      <b>계보</b> ${m.parent?('← '+m.parent):'(원본)'} · <b>상태</b> ${m.status}<br>
      <b>추가지시</b> ${m.extra||'-'}<br>
      <b>prompt</b> ${m.prompt}
    </div>
    <div class="row" style="margin-top:10px"><button class="sm" onclick="reroll('${m.id}')">이 프롬프트로 리롤</button></div>`;
  document.getElementById('dlg').classList.add('on');
}

document.getElementById('go').onclick=generate;
initTypes();loadGallery();
</script>
</body>
</html>
